<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모아 · 우리집 초대장</title>
<meta name="description" content="누르면 모아 앱이 열리고 초대 코드가 자동으로 입력돼요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="모아">
<meta property="og:title" content="모아 · 우리집 초대장">
<meta property="og:description" content="누르면 모아 앱이 열리고 초대 코드가 자동으로 입력돼요.">
<meta property="og:image" content="https://hyyyyjin.github.io/moa-invite/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:#fff6f3;color:#191f28;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:380px;background:#fff;border-radius:28px;padding:36px 28px 28px;text-align:center;box-shadow:0 12px 40px rgba(255,92,122,.15)}
  .icon{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 24px rgba(255,92,122,.3)}
  h1{font-size:23px;margin:20px 0 6px;letter-spacing:-.3px}
  p{color:#6b7684;font-size:15px;line-height:1.55;margin:0}
  .code{margin:24px 0 8px;font-size:30px;font-weight:800;letter-spacing:4px;color:#e8505f;background:#fff1ee;border-radius:16px;padding:14px 0}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:10px}
  .primary{background:linear-gradient(135deg,#FF9A6B,#FF5C7A);color:#fff}
  .ghost{background:#f2f4f6;color:#333d4b}
  .hint{font-size:13px;margin-top:18px}
</style>
</head>
<body>
<main class="card">
  <img class="icon" src="icon.png" alt="모아">
  <h1>우리집 가계부 초대장</h1>
  <p>함께 자산과 가계부를 관리해요.</p>
  <div class="code" id="code">------</div>
  <a class="btn primary" id="open" href="sobok://join">모아 앱에서 합류하기</a>
  <button class="btn ghost" id="copy" type="button">초대 코드 복사</button>
  <p class="hint">앱이 열리지 않으면 모아 앱의 가구 설정에서<br>'초대 코드로 합류'를 고르고 코드를 입력하세요.</p>
</main>
<script>
  var raw = new URLSearchParams(location.search).get('code') || '';
  var code = raw.trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  if (code) {
    document.getElementById('code').textContent = code;
    document.getElementById('open').href = 'sobok://join?code=' + encodeURIComponent(code);
  } else {
    document.getElementById('code').textContent = '코드 없음';
  }
  document.getElementById('copy').addEventListener('click', function () {
    if (!code) return;
    var btn = this;
    navigator.clipboard.writeText(code).then(function () { btn.textContent = '복사했어요'; });
  });
</script>
</body>
</html>
